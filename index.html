<!DOCTYPE html>
<html lang="id" data-t="dark"><head>

<title>FINANCUANZ</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#0A426D;--b2:#03365C;--b3:#021a2e;--card:rgba(255,255,255,.07);--bd:rgba(239,194,135,.16);--tx:#F3F3F5;--mut:#9db2c4;--ac:#EFC287;--org:#E17807;--up:#34d399;--dn:#ff6b6b;--nav:rgba(3,40,70,.85);--inp:rgba(255,255,255,.08)}
:root[data-t=light]{--b1:#F3F3F5;--b2:#F3F3F5;--b3:#e6eaf0;--card:rgba(255,255,255,.75);--bd:rgba(10,66,109,.14);--tx:#03365C;--mut:#5d7388;--ac:#0A426D;--nav:rgba(255,255,255,.9);--inp:rgba(10,66,109,.07);--up:#0f9d6b;--dn:#d83a3a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Manrope,system-ui,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(120% 55% at 50% -8%,var(--b1),var(--b2) 50%,var(--b3)) fixed;font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 120px}
h3{font-size:20px;font-weight:800;margin-bottom:14px}h4{font-size:15px;font-weight:700;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:13px}.up{color:var(--up)}.dn{color:var(--dn)}.big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--inp)}
.ava{width:46px;height:46px;border-radius:50%;background:var(--inp) center/cover;border:2px solid var(--ac);display:grid;place-items:center;font-weight:800;cursor:pointer}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
button{font-family:inherit}.btn{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--org),#f0952f);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
.btn.s{background:var(--inp);color:var(--tx)}.btn.d{background:var(--dn)}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:10px}
input,select{width:100%;height:50px;margin-top:5px;border-radius:14px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);padding:0 14px;font:inherit;font-size:16px}
select option{color:#03365C}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--inp);padding:4px;border-radius:16px;margin-bottom:12px}

.seg button.on{background:var(--org);color:#fff}.seg button.on.sell{background:var(--dn)}.seg button.on.dep{background:var(--b1);color:var(--ac)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);z-index:5}

nav button.on{color:var(--ac)}nav svg{width:24px;height:24px}
nav .fab{flex:0 0 64px;width:64px;height:64px;margin-top:-30px;border-radius:50%;background:linear-gradient(135deg,var(--org),#f0952f);color:#fff;font-size:34px;font-weight:400;box-shadow:0 6px 22px rgba(225,120,7,.5);border:4px solid var(--b2)}
.bar{display:flex;height:10px;border-radius:9px;overflow:hidden;gap:2px;margin:6px 0 12px}
.lg{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.ins{padding:10px 12px;border-radius:14px;background:var(--inp);margin-bottom:8px;font-size:13px;line-height:1.5;border-left:3px solid var(--org)}.ins b{display:block;font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{color:var(--mut);text-align:left;font-weight:600;padding:8px 6px}td{padding:10px 6px;border-top:1px solid var(--bd)}
.bdg{padding:3px 8px;border-radius:8px;font-weight:800;font-size:11px}.BUY{background:rgba(52,211,153,.18);color:var(--up)}.SELL{background:rgba(255,107,107,.18);color:var(--dn)}.DEPOSIT{background:rgba(239,194,135,.2);color:var(--ac)}
.fl{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.fl button{padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;white-space:nowrap;cursor:pointer}.fl button.on{background:var(--org);border-color:var(--org);color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--b2);border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
:root[data-t=light] .sh{background:#fff}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:14px;font-weight:700;z-index:50;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%}
.au{max-width:380px;margin:auto;padding-top:8vh}.logo{font-size:30px;font-weight:800;letter-spacing:1px;color:var(--ac);margin-bottom:6px}
.dots{display:flex;gap:14px;justify-content:center;margin:26px 0}.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ac)}.dots i.f{background:var(--ac)}
.pad{display:grid;grid-template-columns:repeat(3,78px);justify-content:center;gap:16px 24px}.pad button{width:78px;height:78px;aspect-ratio:1/1;padding:0;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:26px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .12s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.pad button:active{transform:scale(.9);background:var(--org);color:#fff;border-color:var(--org)}.pad .ph{visibility:hidden}.pad svg{width:28px;height:28px}
.dots i{transition:background .12s,transform .12s}.dots i.f{transform:scale(1.15)}.dots.err{animation:shake .35s}@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.x{position:sticky;top:0;float:right;width:40px;height:40px;margin:-4px -2px 0 8px;border-radius:50%;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font-size:17px;cursor:pointer;z-index:3}.logoimg{display:block;width:84px;height:84px;margin:0 auto 14px;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.lnk{background:none;border:0;color:var(--ac);font-weight:700;padding:12px;cursor:pointer;width:100%}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pg button{padding:10px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.sh{animation:up .25s ease}@keyframes up{from{transform:translateY(30px);opacity:0}}}
.spl{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.spl .logoimg{width:104px;height:104px;margin-bottom:18px}.ld{width:150px;height:4px;border-radius:4px;background:var(--inp);overflow:hidden;margin:22px auto 10px}.ld i{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--org),var(--ac))}
@media(prefers-reduced-motion:no-preference){.spl .logoimg{animation:pls 1.8s ease-in-out infinite}.ld i{animation:ldm 1.1s ease-in-out infinite}@keyframes pls{50%{transform:scale(1.06)}}@keyframes ldm{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}}
.pie svg{display:block;width:220px;max-width:100%;margin:4px auto 12px;overflow:visible}.pie circle{cursor:pointer;transition:stroke-width .2s,opacity .2s}.pie .lg{padding:8px 10px;border-radius:12px;cursor:pointer;align-items:center}.pie .lg.sel{background:var(--inp)}.pie .seg{margin-bottom:6px}
.seg button.on.div{background:#7c5cd6;color:#fff}.seg button{font-size:13px}.DIVIDEN{background:rgba(167,139,250,.22);color:#b9a4ff}[hidden]{display:none!important}
.seg button.on.wd{background:#b45309;color:#fff}.seg button.on.tf{background:#0e7490;color:#fff}.WITHDRAW{background:rgba(251,191,36,.2);color:#fbbf24}.TRANSFER{background:rgba(56,189,248,.2);color:#38bdf8}
textarea{width:100%;margin-top:5px;border-radius:14px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);padding:12px;font:inherit;font-size:13px}
</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw9W2FZ6SItwlhQH00iy-CFAZoINhhz6emE2ubYX3IeF4tOPnh98Gx7ZYWWDVmwmSk0/exec';  // <- tempel URL Web App Apps Script di sini
const JN={SAHAM_ID:'Saham IHSG',SAHAM_US:'Saham & ETF US',CRYPTO:'Crypto',SBN:'Obligasi/SBN/ORI/Sukuk',RD_PU:'Reksadana Pasar Uang',RD_SAHAM:'Reksadana Saham',RD_CAMPURAN:'Reksadana Campuran',RD_PT:'Reksadana Pend. Tetap',KAS:'Kas'};
const WR={SAHAM_ID:'#EFC287',SAHAM_US:'#E17807',CRYPTO:'#c084fc',SBN:'#38bdf8',RD_PU:'#34d399',RD_SAHAM:'#f472b6',RD_CAMPURAN:'#facc15',RD_PT:'#60a5fa',KAS:'#94a3b8'};
const IC={dash:'<path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6V11h-6zm0-16v5h6V4z"/>',port:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',hist:'<path d="M12 7v5l3 2M4 12a8 8 0 1 0 3-6.2M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',set:'<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7-3l2-1.5-2-3.5-2.4.8a7 7 0 0 0-1.6-1L14.5 4h-4l-.5 2.8a7 7 0 0 0-1.6 1L6 7 4 10.5 6 12a7 7 0 0 0 0 2l-2 1.5L6 19l2.4-.8a7 7 0 0 0 1.6 1l.5 2.8h4l.5-2.8a7 7 0 0 0 1.6-1l2.4.8 2-3.5-2-1.5a7 7 0 0 0 0-2z" fill="none" stroke="currentColor" stroke-width="1.6"/>'};
const $=s=>document.querySelector(s),app=$('#app');
const LOGOSVG=`<svg class="logoimg" viewBox="0 0 512 512"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A426D"/><stop offset="1" stop-color="#03365C"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)"/><path d="M150 380V150h190M150 255h140" fill="none" stroke="#EFC287" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="360" r="28" fill="#E17807"/></svg>`;
let first=true;
let S={token:localStorage.fz_token||'',d:null,page:'dash',hp:1,fl:'ALL'},pin='';
document.documentElement.dataset.t=localStorage.fz_t||'dark';

/* ---------- util ---------- */
async function api(action,p={}){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,token:S.token,...p})});
 const j=await r.json();if(!j.ok){if(j.error==='SESI_HABIS'){logout(true);}throw new Error(j.error);}return j.data;
}
const nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}),nr=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const rp=n=>(n<0?'-':'')+'Rp '+nr.format(Math.abs(Math.round(n)));
const mn=(n,c)=>c==='USD'?'$'+nf.format(n):rp(n),pc=n=>(n>=0?'+':'')+nf.format(n)+'%',cl=n=>n>=0?'up':'dn';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v){v=String(v).trim().replace(/\s/g,'');v=/^[1-9]\d{0,2}(\.\d{3})+$/.test(v)?v.replace(/\./g,''):v.replace(',','.');return parseFloat(v);}
function toast(m,ok=true){const t=$('#toast');t.textContent=(ok?'✓ ':'✕ ')+m;t.style.background=ok?'#0f9d6b':'#d83a3a';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800);}
function sheet(h){closeSheet();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="sh"><button class="x" aria-label="Tutup" onclick="closeSheet()">✕</button>'+h+'</div>';o.onclick=e=>{if(e.target===o)closeSheet();};document.body.appendChild(o);}
const closeSheet=()=>$('#ov')?.remove();
function confirmBox(m,fn){window._cf=fn;sheet(`<h3>Konfirmasi</h3><p class="mut" style="margin-bottom:14px">${m}</p><button class="btn d" onclick="closeSheet();_cf()">Ya, hapus</button><button class="btn s" onclick="closeSheet()">Batal</button>`);}
function toggleTheme(){const t=document.documentElement.dataset.t==='dark'?'light':'dark';document.documentElement.dataset.t=t;localStorage.fz_t=t;}
function readImg(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);r(c.toDataURL('image/jpeg',.8));};im.src=URL.createObjectURL(f);});}

/* ---------- hitung portofolio ---------- */
function calc(){
 const d=S.d,k=d.kurs,I=(v,c)=>c==='USD'?v*k:v,A={};d.aset.forEach(a=>A[a.ticker]=a);
 const tx=[...d.transaksi].sort((a,b)=>(a.tanggal+a.dibuat).localeCompare(b.tanggal+b.dibuat));
 const run=up=>{const H={},cash={},db={};let re=0,dd=0,bf=0,bp=0;
  tx.forEach(t=>{if(up&&t.tanggal>up)return;const amt=t.qty*t.harga,c=t.currency,fe=+t.fee||0,pj=+t.pajak||0,add=(n,v)=>cash[n]=(cash[n]||0)+v;
   if(t.tipe==='DEPOSIT'){add(t.rdn,I(amt,c));return;}
   if(t.tipe==='WITHDRAW'){add(t.rdn,-I(amt,c));return;}
   if(t.tipe==='TRANSFER'){add(t.rdn,-I(amt,c));add(t.rdnTujuan,I(amt,c));return;}
   if(t.tipe==='DIVIDEN'){const v=I(amt,c);add(t.rdn,v);dd+=v;db[t.ticker]=(db[t.ticker]||0)+v;return;}
   const h=H[t.ticker]||(H[t.ticker]={ticker:t.ticker,qty:0,cost:0,cur:c});bf+=I(fe,c);bp+=I(pj,c);
   if(t.tipe==='BUY'){h.qty+=t.qty;h.cost+=amt+fe+pj;add(t.rdn,-I(amt+fe+pj,c));}
   else{const av=h.qty?h.cost/h.qty:t.harga,sq=Math.min(t.qty,h.qty),f=t.qty?sq/t.qty:0;h.cost-=av*sq;h.qty-=sq;re+=I(t.harga*sq-(fe+pj)*f-av*sq,c);add(t.rdn,I(amt-fe-pj,c));}
  });return{H,cash,re,dd,db,bf,bp};};
 const r=run(),hold=Object.values(r.H).filter(h=>h.qty>1e-9).map(h=>{
  const a=A[h.ticker]||{},av=h.cost/h.qty,pr=a.harga!==''&&a.harga!=null?a.harga:av,cur=a.currency||h.cur,nilai=I(h.qty*pr,cur),modal=I(h.cost,cur);
  return{...h,jenis:a.jenis||'SAHAM_ID',nama:a.nama||h.ticker,avg:av,pr,cur,nilai,modal,pl:nilai-modal,div:r.db[h.ticker]||0,pct:modal?(nilai-modal)/modal*100:0};
 }).sort((a,b)=>b.nilai-a.nilai);
 const kas=Object.values(r.cash).reduce((a,b)=>a+b,0),nilai=hold.reduce((a,h)=>a+h.nilai,0),modal=hold.reduce((a,h)=>a+h.modal,0);
 const al={};hold.forEach(h=>al[h.jenis]=(al[h.jenis]||0)+h.nilai);if(kas>0)al.KAS=kas;
 const ms=[];if(tx.length){let [y,m]=tx[0].tanggal.split('-').map(Number);const n=new Date();
  while(y<n.getFullYear()||(y===n.getFullYear()&&m<=n.getMonth()+1)){const key=y+'-'+String(m).padStart(2,'0'),q=run(key+'-31');
   ms.push({l:key,v:Object.values(q.H).reduce((s,h)=>s+I(h.cost,(A[h.ticker]||{}).currency||h.cur),0)});if(++m>12){m=1;y++;}}}
 if(ms.length)ms[ms.length-1].now=nilai;
 return{hold,kas,nilai,modal,fl:nilai-modal,re:r.re,div:r.dd,bf:r.bf,bp:r.bp,al,ms,cash:r.cash,tot:nilai+kas};
}
function insights(c){
 const o=[],T=c.tot;if(!c.hold.length)return[['Mulai dari sini','Catat DEPOSIT ke rekening dana, lalu rekam BUY pertama Anda.']];
 const sh=j=>(c.al[j]||0)/T*100,top=Object.entries(c.al).sort((a,b)=>b[1]-a[1])[0];
 if(top[0]!=='KAS'&&top[1]/T>.5)o.push(['Terlalu terkonsentrasi',`${JN[top[0]]} mencapai ${nf.format(top[1]/T*100)}% portofolio. Pertimbangkan membagi ke jenis aset lain.`]);
 if(c.hold[0].nilai/T>.35)o.push(['Satu aset dominan',`${c.hold[0].ticker} berbobot ${nf.format(c.hold[0].nilai/T*100)}%. Risiko bertumpu pada satu aset.`]);
 if(sh('CRYPTO')>20)o.push(['Porsi crypto tinggi',`Crypto ${nf.format(sh('CRYPTO'))}% dan sangat fluktuatif. Banyak perencana membatasi di bawah 10–20%.`]);
 if(c.kas<0)o.push(['Saldo kas negatif','Pembelian melebihi deposit. Catat DEPOSIT yang belum terekam agar saldo kas akurat.']);
 else if(c.kas/T>.25)o.push(['Kas menganggur',`Kas ${nf.format(c.kas/T*100)}% dari total. Reksadana pasar uang atau SBN bisa memberi imbal hasil lebih baik.`]);
 if(sh('RD_PU')+sh('SBN')+sh('RD_PT')===0)o.push(['Belum ada aset defensif','Tambahkan reksadana pasar uang, pendapatan tetap, atau SBN untuk meredam gejolak.']);
 const usd=c.hold.filter(h=>h.cur==='USD').reduce((a,h)=>a+h.nilai,0)/T*100;if(usd>40)o.push(['Eksposur USD '+nf.format(usd)+'%','Nilai portofolio sensitif terhadap kurs USD/IDR.']);
 c.hold.filter(h=>h.pct<-15).slice(0,2).forEach(h=>o.push([`${h.ticker} turun ${nf.format(Math.abs(h.pct))}%`,'Tinjau kembali alasan Anda membeli aset ini sebelum menambah posisi.']));
 if(!o.length)o.push(['Portofolio seimbang','Tidak ada risiko menonjol saat ini. Tetap rutin menambah investasi.']);return o;
}

/* ---------- autentikasi ---------- */
function splash(){app.innerHTML=`<div class="spl">${LOGOSVG}<div class="logo">FINANCUANZ</div><div class="ld"><i></i></div><p class="mut">Memuat aplikasi…</p></div>`;}
async function boot(){
 splash();const w=first?new Promise(r=>setTimeout(r,1400)):Promise.resolve();first=false;
 if(S.token&&Date.now()>Number(localStorage.fz_exp||0)){S.token='';delete localStorage.fz_token;delete localStorage.fz_exp;toast('Aplikasi terkunci karena tidak aktif 1 jam. Masukkan PIN untuk masuk lagi.',false);}
 if(S.token){try{await load();await w;watch();return shell();}catch(e){}}
 try{const s=await api('status');await w;s.terdaftar?loginView():regView();}
 catch(e){await w;app.innerHTML=`<div class="au" style="text-align:center">${LOGOSVG}<div class="logo">FINANCUANZ</div><p class="mut" style="margin:10px 0 16px">Tidak dapat terhubung ke server. Periksa URL Web App dan koneksi internet.</p><button class="btn" onclick="boot()">Coba lagi</button></div>`;}
}
const load=async()=>{S.d=await api('getAll');};
const SESI=3600e3; // kunci otomatis setelah 1 jam tanpa aktivitas
let lastTouch=0,lastPing=0;
function setSesi(t){S.token=t;localStorage.fz_token=t;localStorage.fz_exp=Date.now()+SESI;lastPing=Date.now();watch();}
function activity(){ // setiap sentuhan/ketikan memperpanjang waktu 1 jam
 if(!S.token)return;const n=Date.now();
 if(n>Number(localStorage.fz_exp||0))return expire();
 if(n-lastTouch<3000)return;lastTouch=n;localStorage.fz_exp=n+SESI;watch();

 <div class="card"><h4>Mata uang</h4><p class="mut">Tampilan utama: Rupiah (Rp). Kurs USD/IDR saat ini: <b>${rp(d.kurs).slice(3)}</b> ${d.kursManual?'(manual)':'(otomatis)'}</p><label>Kurs manual (kosongkan untuk otomatis)<input id="s_k" inputmode="decimal" value="${d.kursManual}"></label><button class="btn s" onclick="saveKurs()">Simpan kurs</button></div>
 <div class="card"><h4>Biaya default Saham IHSG</h4><p class="mut" style="margin-bottom:8px">Terisi otomatis di form BUY/SELL dan masih bisa diubah. Isi 0 jika tidak ada. Tersimpan di perangkat ini.</p><div class="g2"><label>Fee beli (%)<input id="s_fb" inputmode="decimal" value="${FEE().b??''}"></label><label>Fee jual (%)<input id="s_fs" inputmode="decimal" value="${FEE().s??''}"></label></div><label>Pajak jual (%)<input id="s_ft" inputmode="decimal" value="${FEE().t??''}"></label><button class="btn s" onclick="saveFee()">Simpan biaya default</button></div>
 <div class="card"><h4>Impor transaksi</h4><p class="mut" style="margin-bottom:8px">Masukkan banyak transaksi sekaligus dari Excel atau CSV.</p><button class="btn s" onclick="impForm()">Impor dari Excel/CSV</button></div>
 <div class="card"><div class="row"><h4>Referensi aset</h4><button class="chip" onclick="asetForm()">+ Tambah</button></div>${d.aset.map(a=>`<div class="lg" onclick="asetForm('${esc(a.ticker)}')" style="cursor:pointer"><span><b>${esc(a.ticker)}</b> <span class="mut">${JN[a.jenis]||''}</span></span><span>${a.harga===''?'-':mn(a.harga,a.currency)}</span></div>`).join('')||'<p class="mut">Aset otomatis ditambahkan saat Anda merekam transaksi.</p>'}</div>
 <div class="card"><div class="row"><h4>Rekening dana nasabah</h4><button class="chip" onclick="rdnForm()">+ Tambah</button></div>${d.rekening.map(r=>`<div class="lg"><span>${esc(r)}</span><button class="chip" onclick="delRdn('${esc(r)}')">Hapus</button></div>`).join('')}</div>
 <button class="btn s" onclick="logout()">Keluar</button>`;
}

 <label>Jenis<select id="a_j">${Object.keys(JN).filter(k=>k!=='KAS').map(k=>`<option value="${k}" ${a.jenis===k?'selected':''}>${JN[k]}</option>`).join('')}</select></label>
 <label>Currency<select id="a_c"><option>IDR</option><option ${a.currency==='USD'?'selected':''}>USD</option></select></label>
 <label>Kode Google Finance (kosong = harga manual)<input id="a_g" placeholder="IDX:BBCA / NASDAQ:AAPL" value="${esc(a.gTicker)}"></label>

 <button class="btn" onclick="saveAset()">Simpan</button><button class="btn s" onclick="closeSheet()">Batal</button>${t?`<button class="btn d" onclick="delAset('${esc(t)}')">Hapus aset</button>`:''}`);

/* ---------- Biaya default & impor ---------- */
function saveFee(){localStorage.fz_fee=JSON.stringify({b:num($('#s_fb').value)||0,s:num($('#s_fs').value)||0,t:num($('#s_ft').value)||0});toast('Biaya default disimpan');}
const HM={tanggal:'tanggal',date:'tanggal',tgl:'tanggal',tipe:'tipe',type:'tipe',transaksi:'tipe',jenis:'jenis',kategori:'jenis',ticker:'ticker',simbol:'ticker',kode:'ticker',symbol:'ticker',qty:'qty',quantity:'qty',jumlah:'qty',lembar:'qty',unit:'qty',harga:'harga',price:'harga',nominal:'harga',currency:'currency',mata_uang:'currency',rdn:'rdn',rekening:'rdn',platform:'rdn',catatan:'catatan',note:'catatan',keterangan:'catatan',fee:'fee',biaya:'fee',komisi:'fee',pajak:'pajak',tax:'pajak',rdn_tujuan:'tujuan',tujuan:'tujuan'};
const TPM={buy:'BUY',beli:'BUY',sell:'SELL',jual:'SELL',deposit:'DEPOSIT',setor:'DEPOSIT',setoran:'DEPOSIT',dividen:'DIVIDEN',dividend:'DIVIDEN',withdraw:'WITHDRAW',tarik:'WITHDRAW',penarikan:'WITHDRAW',transfer:'TRANSFER',pindah:'TRANSFER'};
const sig=t=>[t.tanggal,t.tipe,t.ticker,+t.qty,+t.harga,t.rdn].join('|');
let IMP=[];
function parseTbl(t){
 t=t.replace(/^\uFEFF/,'');const f1=t.split(/\r?\n/)[0],d=['\t',';',','].map(x=>[x,f1.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0],R=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
  else if(ch==='"')q=true;else if(ch===d){row.push(f);f='';}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))R.push(row);row=[];}
  else f+=ch;}
 row.push(f);if(row.some(x=>x.trim()))R.push(row);return R;
}
function normDate(v){v=String(v).trim();let m,y,mo,d;
 if(m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(v)){y=m[1];mo=+m[2];d=+m[3];}
 else if(m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(v)){d=+m[1];mo=+m[2];y=m[3];}else return'';
 const dt=new Date(+y,mo-1,d);return dt.getFullYear()==y&&dt.getMonth()==mo-1&&dt.getDate()==d?`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`:'';}
function normJenis(v,tk){v=String(v||'').trim();const u=v.toUpperCase().replace(/[\s&\/]+/g,'_');if(JN[u]&&u!=='KAS')return u;
 const e=Object.entries(JN).find(([k,n])=>n.toLowerCase()===v.toLowerCase());if(e)return e[0];const a=S.d.aset.find(x=>x.ticker===tk);return a?a.jenis:'';}
function impRows(text){
 const T=parseTbl(text);if(T.length<2)throw new Error('Data kosong atau baris judul tidak ada.');
 const H=T[0].map(h=>HM[h.trim().toLowerCase().replace(/[\s-]+/g,'_')]||null);
 ['tanggal','tipe','harga'].forEach(k=>{if(!H.includes(k))throw new Error('Kolom "'+k+'" tidak ditemukan di baris judul.');});
 const ok=[],err=[],dup=[],seen=new Set(S.d.transaksi.map(sig));
 T.slice(1).forEach((r,i)=>{const o={},n=i+2;H.forEach((k,j)=>{if(k)o[k]=(r[j]||'').trim();});
  try{
   const tipe=TPM[(o.tipe||'').toLowerCase()];if(!tipe)throw new Error('tipe "'+o.tipe+'" tidak dikenal');
   const tg=normDate(o.tanggal);if(!tg)throw new Error('tanggal tidak valid');
   const kas=KAS_T.includes(tipe),nom=kas||tipe==='DIVIDEN',tk=kas?'KAS':(o.ticker||'').toUpperCase();if(!tk)throw new Error('ticker kosong');
   const q=nom?1:num(o.qty),h=num(o.harga);if(!(q>0))throw new Error('qty harus lebih dari 0');if(!(h>0))throw new Error('harga/nominal harus lebih dari 0');
   const jenis=kas?'KAS':normJenis(o.jenis,tk);if((tipe==='BUY'||tipe==='SELL')&&!jenis)throw new Error('jenis tidak diketahui untuk '+tk);
   const a=S.d.aset.find(x=>x.ticker===tk),cur=(o.currency||(a&&a.currency)||'IDR').toUpperCase();if(cur!=='IDR'&&cur!=='USD')throw new Error('currency harus IDR atau USD');
   const rdn=o.rdn||S.d.rekening[0]||'Utama',tu=tipe==='TRANSFER'?(o.tujuan||''):'';if(tipe==='TRANSFER'&&(!tu||tu===rdn))throw new Error('rdn_tujuan wajib dan harus berbeda dari rdn');
   const fe=num(o.fee)||0,pj=num(o.pajak)||0;if(fe<0||pj<0)throw new Error('fee/pajak tidak boleh negatif');
   const t={tanggal:tg,tipe,jenis,ticker:tk,qty:q,harga:h,currency:cur,rdn,catatan:o.catatan||'',fee:fe,pajak:pj,rdnTujuan:tu};
   seen.has(sig(t))?dup.push(n):ok.push(t);
  }catch(e){err.push('Baris '+n+': '+e.message);}});
 return{ok,err,dup};
}
function impForm(){
 sheet(`<h3>Impor transaksi</h3><p class="mut" style="margin-bottom:10px;line-height:1.5">Tempel data dari Excel/Google Sheets lengkap dengan baris judul, atau pilih file CSV. Kolom wajib: <b>tanggal, tipe, harga</b>, serta <b>ticker, qty, jenis</b> untuk BUY/SELL. Opsional: currency, rdn, catatan, fee, pajak, rdn_tujuan. Untuk DEPOSIT/WITHDRAW/DIVIDEN/TRANSFER isi nominal di kolom harga. Tipe: BUY, SELL, DEPOSIT, DIVIDEN, WITHDRAW, TRANSFER. Jenis: SAHAM_ID, SAHAM_US, CRYPTO, SBN, RD_PU, RD_SAHAM, RD_CAMPURAN, RD_PT. Tanggal: 2024-03-15 atau 15/03/2024. Qty dalam lembar.</p>
 <button class="btn s" onclick="tplCsv()">Unduh template CSV</button><label style="margin-top:12px">File CSV<input type="file" accept=".csv,.txt,text/csv" onchange="impFile(this)"></label>
 <label>Atau tempel data di sini<textarea id="i_t" rows="6"></textarea></label><button class="btn" onclick="impPreview()">Periksa data</button><div id="i_p"></div><button class="btn s" onclick="closeSheet()">Batal</button>`);
}
function impFile(el){const f=el.files[0];if(!f)return;const R=new FileReader();R.onload=()=>{$('#i_t').value=R.result;impPreview();};R.readAsText(f);}
function impPreview(){
 try{const R=impRows($('#i_t').value);IMP=R.ok;
  $('#i_p').innerHTML=`<div class="card" style="margin-top:12px"><b class="${R.ok.length?'up':'mut'}">${R.ok.length} siap diimpor</b>${R.dup.length?` · <span class="mut">${R.dup.length} duplikat dilewati</span>`:''}${R.err.length?` · <b class="dn">${R.err.length} bermasalah</b>`:''}
  ${R.err.slice(0,8).map(e=>`<div class="dn" style="margin-top:6px;font-size:13px">${esc(e)}</div>`).join('')}${R.err.length>8?`<div class="mut">…dan ${R.err.length-8} lainnya</div>`:''}
  ${R.ok.length?`<div class="tw" style="margin-top:8px"><table><tr><th>Tanggal</th><th>Tipe</th><th>Simbol</th><th>Qty</th><th>Harga</th></tr>${R.ok.slice(0,5).map(t=>`<tr><td>${t.tanggal}</td><td><span class="bdg ${t.tipe}">${t.tipe}</span></td><td>${esc(t.ticker)}</td><td>${t.tipe==='BUY'||t.tipe==='SELL'?nf.format(t.qty):'-'}</td><td>${mn(t.harga,t.currency)}</td></tr>`).join('')}</table></div>`:''}</div>
  ${R.err.length?'<p class="mut" style="margin-bottom:8px">Perbaiki baris bermasalah lalu periksa lagi. Belum ada data yang disimpan.</p>':R.ok.length?`<button class="btn" id="i_go" onclick="impGo()">Impor ${R.ok.length} transaksi</button>`:''}`;
 }catch(e){toast(e.message,false);}
}
async function impGo(){
 const b=$('#i_go');b.disabled=true;b.textContent='Mengimpor…';
 try{const r=await api('importTx',{rows:IMP});await load();closeSheet();S.fl='ALL';S.hp=1;go('hist');toast(r.n+' transaksi berhasil diimpor');}
 catch(e){toast(e.message,false);b.disabled=false;b.textContent='Impor '+IMP.length+' transaksi';}
}
function tplCsv(){
 const c='tanggal,tipe,jenis,ticker,qty,harga,currency,rdn,catatan,fee,pajak,rdn_tujuan\n2024-03-15,DEPOSIT,,,,5000000,IDR,Stockbit,Setoran awal,,,\n2024-03-18,BUY,SAHAM_ID,BBCA,100,9250,IDR,Stockbit,,1387,,\n2024-06-20,SELL,SAHAM_ID,BBCA,50,9800,IDR,Stockbit,,1225,490,\n2024-07-01,DIVIDEN,SAHAM_ID,BBCA,,125000,IDR,Stockbit,,,,\n2024-08-01,TRANSFER,,,,1000000,IDR,Stockbit,,,,Bibit\n2024-09-01,WITHDRAW,,,,500000,IDR,Stockbit,,,,\n';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='template-financuanz.csv';a.click();
}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
boot();
</script></body></html>
